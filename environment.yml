# Conda environment for the AI/ML Python workers and bridge service.
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
#
# PyTorch GPU wheels: after creating the env, you may need to reinstall torch/torchvision
# for your CUDA version — see https://pytorch.org/get-started/locally/
# (Do not assume the CUDA build below matches your GPU/driver.)

name: security-camera-ml

channels:
  - conda-forge
  - pytorch
  - nvidia

dependencies:
  - python=3.11.11
  - pip
  - setuptools
  - wheel
  # Used by Node.js video chunking (utils/ffmpeg.js), not imported in Python
  - ffmpeg

  - pip:
      # --- Core ML (directly imported) ---
      - torch==2.10.0
      - torchvision==0.25.0
      - numpy==2.3.5
      - opencv-python==4.13.0.92
      - pillow==10.4.0

      # --- Detection, OCR, audio, VLM ---
      - ultralytics==8.4.18
      - easyocr==1.7.2
      - openai-whisper==20250625
      - transformers==4.43.3

      # --- Database (slide_processor.py) ---
      - pymongo==4.16.0
      - dnspython==2.8.0  # needed for mongodb+srv:// URIs

      # --- Test utility (test_pipeline.py only) ---
      - requests==2.32.5

      # YOLO-World models (yolov8s-worldv2.pt in ai_bridge.py / slide_processor.py)
      # may require CLIP — install manually if world-model loading fails:
      #   pip install git+https://github.com/ultralytics/CLIP.git
